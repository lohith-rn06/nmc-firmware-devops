apiVersion: v1
kind: ResourceQuota
metadata: { name: agents, namespace: jenkins-agents }
spec:
  hard: { requests.cpu: "64", requests.memory: 160Gi, pods: "50" }
---
apiVersion: v1
kind: LimitRange
metadata: { name: agent-defaults, namespace: jenkins-agents }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 250m, memory: 256Mi }
      default: { memory: 2Gi }
