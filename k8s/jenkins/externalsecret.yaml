# Pulls Jenkins secrets (SSO metadata, GitHub App key, Sonar token, Teams webhook) from AWS Secrets Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: jenkins-casc-secrets, namespace: jenkins }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: jenkins-casc-secrets }
  dataFrom:
    - extract: { key: nmc/jenkins/casc }
