repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - { id: trailing-whitespace }
      - { id: end-of-file-fixer }
      - { id: check-yaml, args: [--allow-multiple-documents], exclude: '^helm/.*/templates/' }
      - { id: detect-private-key }
      - { id: check-added-large-files, args: [--maxkb=500] }
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.1
    hooks: [{ id: gitleaks, args: [--config, security/gitleaks.toml] }]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks: [{ id: clang-format, types_or: [c] }]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks: [{ id: hadolint }]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks: [{ id: terraform_fmt }, { id: terraform_validate }]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks: [{ id: conventional-pre-commit, stages: [commit-msg], args: [feat, fix, sec, perf, docs, ci, build, test, refactor, chore] }]
