apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nmc.name" . }}-test
  labels: { app: nmc-itest }
  annotations: { "helm.sh/hook": test, "helm.sh/hook-delete-policy": hook-succeeded }
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      args: ["-fsS", "http://{{ include "nmc.name" . }}:{{ .Values.ports.http }}/api/version"]
